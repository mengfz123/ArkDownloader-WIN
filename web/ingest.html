<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ArkDownloader · 接收任务</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f1419;
      color: #e7ecf3;
    }
    .card {
      max-width: 28rem;
      padding: 1.5rem 1.75rem;
      border: 1px solid #243041;
      border-radius: 12px;
      background: #161d27;
      text-align: center;
    }
    h1 { font-size: 1.05rem; margin: 0 0 0.75rem; font-weight: 600; }
    p { margin: 0; color: #9aa8bc; line-height: 1.5; font-size: 0.92rem; }
    .ok { color: #3dd68c; }
    .err { color: #ff7b72; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ArkDownloader</h1>
    <p id="status">已就绪，等待网页推送任务…</p>
  </div>
  <script>
    const el = document.getElementById("status");
    const setStatus = (text, cls) => {
      el.className = cls || "";
      el.textContent = text;
    };

    const addTask = async (task) => {
      const r = await fetch("/api/v1/tasks", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify(task || {}),
      });
      const j = await r.json().catch(() => null);
      if (!r.ok || !j || Number(j.code) !== 0) {
        throw new Error((j && j.msg) || ("HTTP " + r.status));
      }
      return j.data;
    };

    window.addEventListener("message", async (ev) => {
      const data = ev.data;
      if (!data || data.type !== "ark-push" || !Array.isArray(data.tasks)) return;

      setStatus("正在添加 " + data.tasks.length + " 个任务…");
      let ok = 0;
      let fail = 0;
      const errors = [];
      for (const task of data.tasks) {
        try {
          await addTask(task);
          ok += 1;
        } catch (e) {
          fail += 1;
          errors.push(String((e && e.message) || e));
        }
      }

      if (ok > 0 && fail === 0) {
        setStatus("已添加 " + ok + " 个下载任务", "ok");
      } else if (ok > 0) {
        setStatus("成功 " + ok + "，失败 " + fail, "err");
      } else {
        setStatus("添加失败：" + (errors[0] || "未知错误"), "err");
      }

      try {
        if (ev.source) {
          ev.source.postMessage(
            { type: "ark-push-done", ok: ok, fail: fail, errors: errors },
            ev.origin || "*"
          );
        }
      } catch (e) { /* ignore */ }

      if (ok > 0 && fail === 0) {
        setTimeout(() => {
          try { window.close(); } catch (e) { /* ignore */ }
        }, 900);
      }
    });

    try {
      if (window.opener) {
        window.opener.postMessage({ type: "ark-ingest-ready" }, "*");
      }
    } catch (e) { /* ignore */ }
  </script>
</body>
</html>
